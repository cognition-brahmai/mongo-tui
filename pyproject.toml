[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mongrove"
version = "0.1.0"
description = "A keyboard-first terminal user interface for MongoDB"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Mongrove contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
urls = { Homepage = "https://mongrove.oss.brahmai.in", Documentation = "https://mongrove.oss.brahmai.in" }
dependencies = [
  "platformdirs>=4.0,<5",
  "pymongo>=4.0,<5",
  "textual>=8.0,<9",
]

[project.optional-dependencies]
dev = [
  "build>=1.0,<2",
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
mongrove = "mongrove.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mongrove = ["ui/styles/*.tcss"]
